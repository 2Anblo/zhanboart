<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>照片暗房 · zhanbo.art</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="wordmark" href="http://localhost:3000/photos" target="_blank" rel="noreferrer">
        ZHANBO.ART
      </a>
      <div class="status" id="status" aria-live="polite">
        <span class="status-dot"></span>
        正在检查 R2
      </div>
    </header>

    <main class="workspace">
      <section class="editor" aria-labelledby="editor-title">
        <div class="section-label">LOCAL DARKROOM / R2</div>
        <h1 id="editor-title">放入一张<br />尚未命名的光</h1>
        <p class="intro">图片会进入 Cloudflare R2，文字会留在本地 Markdown。发布仍由 Git 完成。</p>

        <div class="setup-panel" id="setup-panel" hidden>
          <strong>还差一点配置</strong>
          <p id="setup-message"></p>
          <code>.env.local</code>
        </div>

        <form id="upload-form">
          <label class="drop-zone" id="drop-zone">
            <input id="file" name="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" required />
            <img id="preview" alt="待上传照片预览" hidden />
            <span class="drop-copy" id="drop-copy">
              <span class="drop-mark">＋</span>
              <strong>选择或拖入照片</strong>
              <small>JPG / PNG / WebP / GIF / AVIF · 最大 30 MB</small>
            </span>
          </label>

          <div class="field-pair">
            <label>
              <span>标题</span>
              <input name="title" type="text" placeholder="百叶窗的光" />
            </label>
            <label>
              <span>日期</span>
              <input id="date" name="date" type="date" required />
            </label>
          </div>

          <label>
            <span>说明</span>
            <textarea name="caption" rows="2" placeholder="这一刻为什么被留下"></textarea>
          </label>

          <div class="field-pair">
            <label>
              <span>地点</span>
              <input name="location" type="text" placeholder="Shanghai" />
            </label>
            <label>
              <span>心情</span>
              <input name="mood" type="text" placeholder="quiet" />
            </label>
          </div>

          <label>
            <span>标签</span>
            <input name="tags" type="text" placeholder="light, memory, room" />
          </label>

          <label>
            <span>正文</span>
            <textarea name="body" rows="5" placeholder="如果这张照片还有一些话……"></textarea>
          </label>

          <div class="publish-row">
            <label>
              <span>可见性</span>
              <select name="visibility">
                <option value="public">公开</option>
                <option value="unlisted">不列出</option>
                <option value="draft">草稿</option>
              </select>
            </label>
            <button class="primary-button" id="upload-button" type="submit">上传并保存</button>
          </div>
        </form>
      </section>

      <section class="contact-sheet" aria-labelledby="library-title">
        <div class="library-heading">
          <div>
            <div class="section-label">CONTACT SHEET</div>
            <h2 id="library-title">照片记录</h2>
          </div>
          <span class="photo-count" id="photo-count">—</span>
        </div>
        <div class="notice" id="notice" hidden aria-live="polite"></div>
        <div class="photo-grid" id="photo-grid"></div>
        <div class="empty-state" id="empty-state" hidden>
          还没有照片。左边的第一张会成为这里的开始。
        </div>
      </section>
    </main>

    <template id="photo-template">
      <article class="photo-card">
        <div class="photo-frame"><img alt="" loading="lazy" /></div>
        <div class="photo-meta">
          <div>
            <time></time>
            <h3></h3>
            <p></p>
          </div>
          <button class="delete-button" type="button">删除</button>
        </div>
      </article>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>

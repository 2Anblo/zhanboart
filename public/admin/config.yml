    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} - {{date}}"
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 日期, name: date, widget: date, format: "YYYY-MM-DD" }
      - { label: 类型, name: type, widget: hidden, default: music }
      - { label: 艺术家, name: artist, widget: string, required: false }
      - { label: 摘要, name: excerpt, widget: text, required: false }
      - { label: 音频, name: audio, widget: file, required: false }
      - { label: 封面, name: albumArt, widget: image, required: false }
      - { label: 图片, name: image, widget: image, required: false }
      - { label: 心情, name: mood, widget: string, required: false }
      - { label: 地点, name: location, widget: string, required: false }
      - { label: 标签, name: tags, widget: list, required: false, allow_add: true }
      - label: 可见性
        name: visibility
        widget: select
        default: draft
        options:
          - { label: 公开, value: public }
          - { label: 不列出, value: unlisted }
          - { label: 草稿, value: draft }
      - { label: 正文, name: body, widget: markdown }

  - name: thoughts
    label: 想法
    label_singular: 想法
    folder: content/thoughts
